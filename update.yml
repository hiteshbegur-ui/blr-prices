name: Update prices

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scraper/scrape.py
        env:
          PINCODE: "560034"
      - name: Save debug files if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: scraper/debug/
      - name: Commit new prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/data/prices.json
          git diff --staged --quiet || (git commit -m "Update prices $(date -u +%F\ %H:%M)" && git push)
